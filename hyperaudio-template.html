<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <meta name="description" content="{description}">
  <meta property="og:title" content="{title}">
  <meta property="og:description" content="{description}">
  <meta property="og:type" content="article">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hyperaudio/hyperaudio-lite/css/hyperaudio-lite-player.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hyperaudio/hyperaudio-lite/css/share-this.css">
  <style>
    body {
      margin: 0;
      background: #f7f7f8;
      color: #1a1a1a;
    }
    /* The page says what it is a transcript of. Sized to sit under the
       player's own weight rather than compete with it; an export with no
       title omits the element entirely, so there is no empty gap. */
    /* Taking the text is the commonest thing anyone does with a transcript
       page, and select-to-copy is a different job (it copies a quotation
       plus a replay link). This copies the whole transcript, always. */
    /* The editor's corner copy button, transplanted: it sits in the TRANSCRIPT
       PANE's own top-right corner (the wrapper is the positioning context, so
       the button never lands in the transcript markup the player walks), grey
       until hovered, icon only. */
    /* The wrapper must be the CARD's box, not the page column's: #hypertranscript
       is 34rem centred inside a 40rem wrap, so a button anchored to the wrap
       landed ~30px outside the card's right edge. */
    .ht-transcript-wrap {
      position: relative;
      max-width: 34rem;
      margin: 0 auto;
    }
    #ht-copy {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: rgba(247, 247, 248, 0.82);
      color: rgba(26, 26, 26, 0.5);
      cursor: pointer;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }
    #ht-copy:hover { color: #1a1a1a; }
    #ht-copy[data-copied] { color: #1f7a48; }
    @media print { #ht-copy { display: none; } }

    .ht-title {
      max-width: 34rem;
      margin: 20px auto 12px;
      padding: 0 8px;
      font: 600 1.25rem/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #23252a;
      text-align: center;
      overflow-wrap: anywhere;
    }
    /* ------------------------------------------------------------------
       Select-to-copy. The library owns behaviour — it positions #popover,
       toggles its display, writes #clipboard-text and opens the dialog —
       so everything here is presentation only (position/display on
       #popover are the library's contract and must survive).

       What the reader copies is a quotation plus a link that replays the
       exact moment it was spoken, so the confirmation is built as a
       citation card rather than a toast: the captured words are set in the
       transcript's own Palatino because they are speech, not a string, and
       the single accent goes to the timecode chip — the one thing that
       makes a Hyperaudio quote unlike any other copied text.
       ------------------------------------------------------------------ */
    #popover {
      position: absolute;
      display: none;
      z-index: 10;
      padding: 6px 11px;
      border: 1px solid #e6e6e6;
      border-radius: 9px;
      background-color: #fff;
      box-shadow: 0 6px 20px rgba(20, 14, 60, 0.14);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    #popover a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #1a1a1a;
      cursor: pointer;
    }
    #popover a:hover { color: #4a00ff; }

    #clipboard-dialog {
      width: min(34rem, calc(100vw - 32px));
      padding: 22px 24px 18px;
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      background: #fff;
      color: #1a1a1a;
      box-shadow: 0 18px 48px rgba(20, 14, 60, 0.18);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #clipboard-dialog::backdrop {
      background: rgba(24, 20, 45, 0.32);
      backdrop-filter: blur(2px);
    }
    #clipboard-dialog [hidden] { display: none; }
    .cb-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }
    #clipboard-heading {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #8b8b93;
    }
    /* the signature: in/out points parsed from the copied link's media
       fragment — the only colour on the card */
    .cb-range {
      padding: 3px 9px;
      border-radius: 999px;
      background: #f1ecff;
      color: #4a00ff;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .cb-quote { margin: 0; }
    .cb-quote p {
      margin: 0;
      max-height: 40vh;
      overflow-y: auto;
      padding: 16px 18px;
      border-radius: 10px;
      background: #f7f6ff;
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
      font-size: 1.06rem;
      line-height: 1.65;
    }
    .cb-link {
      margin: 12px 0 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: #8b8b93;
    }
    .cb-actions { margin-top: 16px; text-align: right; }
    #clipboard-confirm {
      padding: 8px 18px;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    #clipboard-confirm:hover { border-color: #4a00ff; color: #4a00ff; }
    #clipboard-confirm:focus-visible { outline: 2px solid #4a00ff; outline-offset: 2px; }
    @media (prefers-reduced-motion: no-preference) {
      #clipboard-dialog[open] { animation: cb-rise 160ms ease-out; }
      @keyframes cb-rise {
        from { opacity: 0; transform: translateY(6px); }
      }
    }
    /* Constrain everything to a comfortable reading column and centre it. */
    .ht-wrap {
      max-width: 40rem;
      margin: 0 auto;
      padding: 28px 18px 56px;
    }
    /* A modest, centred player rather than a full-width one. */
    #hyperplayer {
      width: 100%;
      max-width: 420px;
      display: block;
      margin: 0 auto 24px;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
    }
    /* The transcript stays a scroll box (the read-along autoscroll scrolls
       within it), but with a constrained line length and calmer styling.
       ID selector overrides the player CSS's .hyperaudio-transcript rules. */
    #hypertranscript {
      max-width: 34rem;
      margin: 0 auto;
      height: 58vh;
      min-height: 320px;
      overflow-y: auto;
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      background: #fff;
      padding: 20px 24px;
      font-size: 1.06rem;
      line-height: 1.75;
    }
    /* Read-along contrast: spoken text solid, upcoming text muted. */
    .hyperaudio-transcript .read,
    .hyperaudio-transcript .active > .active { color: #111; }
    .hyperaudio-transcript .unread { color: #a2a2a2; }
    .hyperaudio-transcript .speaker { font-weight: 700; }
  </style>
</head>
<body>
  <main class="ht-wrap">
    <h1 class="ht-title">{heading}</h1>
    <video id="hyperplayer" class="hyperaudio-player" playsinline controls src="{sourcemedia}" type="video/mp4">
      <track id="hyperplayer-vtt" label="English" kind="subtitles" srclang="en" src="{sourcevtt}">
    </video>

    <div class="ht-transcript-wrap">
      <button id="ht-copy" type="button" aria-label="Copy transcript" title="Copy transcript">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      </button>
      <div id="hypertranscript" class="hyperaudio-transcript">
{hypertranscript}
      </div>
    </div>

    <!-- Select-to-copy: hyperaudio-lite's OWN copy feature, which it
         activates only when this markup is present (it feature-detects the
         #popover element). The ids are the library's contract — popover,
         popover-btn, clipboard-dialog, clipboard-text, clipboard-confirm.
         This replaces the old share-this sharer, whose confirmation was an
         alert() assembled as an inline onclick string. -->
    <div id="popover"><a id="popover-btn">Copy to clipboard <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="-130 -110 600 600"><path d="m161,152.9h190c0.1,0 0.1,0 0.2,0 10.8,0 19.6-7.1 19.6-16 0-1.5-14.1-82.7-14.1-82.7-1.3-7.9-9.6-13.8-19.4-13.8l-61.7,.1v-13.5c0-8.8-8.8-16-19.6-16-10.8,0-19.6,7.1-19.6,16v13.6l-61.8,.1c-9.8,0-18,5.9-19.4,13.8l-13.7,80.3c-1.2,14.3 13.5,18.1 19.5,18.1z" fill="currentcolor"/><path d="m427.5,78.9h-26.8c0,0 9.3,53.5 9.3,58 0,30.4-26.4,55.2-58.8,55.2h-190.2c-19.6,0.4-63.3-14.7-58.1-63.9l8.4-49.2h-26.8c-10.8,0-19.6,8.8-19.6,19.6v382.9c0,10.8 8.8,19.6 19.6,19.6h343c10.8,0 19.6-8.8 19.6-19.6v-383c0-10.8-8.8-19.6-19.6-19.6zm-76.5,320.1h-190c-10.8,0-19.6-8.8-19.6-19.6 0-10.8 8.8-19.6 19.6-19.6h190c10.8,0 19.6,8.8 19.6,19.6 0,10.8-8.7,19.6-19.6,19.6zm0-110.3h-190c-10.8,0-19.6-8.8-19.6-19.6 0-10.8 8.8-19.6 19.6-19.6h190c10.8,0 19.6,8.8 19.6,19.6 0,10.8-8.7,19.6-19.6,19.6z" fill="currentcolor"/></svg></a></div>

    <dialog id="clipboard-dialog" aria-labelledby="clipboard-heading">
      <div class="cb-head">
        <h2 id="clipboard-heading">Copied to clipboard</h2>
        <span id="clipboard-range" class="cb-range" hidden></span>
      </div>
      <blockquote class="cb-quote"><p id="clipboard-text"></p></blockquote>
      <p id="clipboard-link" class="cb-link" hidden></p>
      <div class="cb-actions">
        <button id="clipboard-confirm">Done</button>
      </div>
    </dialog>

    <footer style="max-width:34rem; margin:16px auto 24px; text-align:center; font-size:0.85rem; color:#a2a2a2;">
      <a href="https://hyperaudio.github.io/hyperaudio-lite-editor/" style="color:inherit; text-decoration:underline;">Made with Hyperaudio</a>
    </footer>
  </main>

  <script>
  // If the media can't be found — most often because this page was moved away
  // from its media file — explain how to fix it instead of showing a dead
  // player. The media is referenced by RELATIVE path on purpose: the page and
  // its media travel (and upload) together; an absolute local path would break
  // the moment either is shared or hosted.
  (function () {
    var player = document.getElementById('hyperplayer');
    if (!player) return;
    player.addEventListener('error', function () {
      if (document.getElementById('media-missing-note')) return;
      var ref = player.getAttribute('src') || 'the media file';
      var note = document.createElement('div');
      note.id = 'media-missing-note';
      note.setAttribute('role', 'alert');
      note.style.cssText = 'max-width:420px; margin:0 auto 24px; padding:14px 18px; ' +
        'border:1px solid #e5b5b5; border-radius:10px; background:#fdf3f3; color:#7a2e2e; ' +
        'font-size:0.95rem; line-height:1.5;';
      note.textContent = 'Couldn’t load “' + ref + '”. Keep this page in the ' +
        'same folder as the media file — or, if the media is hosted online, edit this ' +
        'file’s video src to its full URL.';
      player.insertAdjacentElement('afterend', note);
    });
  })();
  </script>

  <script>
  /* Copy transcript — the editor's own contract (#467), inherited rather than
     reinvented: it ALWAYS copies the whole transcript (a selection-sensitive
     button is a trap, and selection copying already has an owner here — the
     citation popover), it writes both a plain-text and a conservative HTML
     flavour so it pastes cleanly everywhere, and because a clipboard write is
     invisible it flips to a checkmark and announces itself to screen readers.
     Struck-through words are speech the author removed, so they are not
     copied. */
  (function () {
    var btn = document.getElementById('ht-copy');
    var transcript = document.getElementById('hypertranscript');
    if (!btn || !transcript) return;

    var status = document.createElement('div');
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    status.style.cssText = 'position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;';
    document.body.appendChild(status);

    var COPY_ICON = btn.innerHTML;
    var CHECK_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
    var resetTimer = null;

    function blocks() {
      var out = [];
      transcript.querySelectorAll('p').forEach(function (p) {
        var speaker = '';
        var words = [];
        p.querySelectorAll('span[data-m]').forEach(function (span) {
          if ((span.style.textDecoration || '').indexOf('line-through') !== -1) return;
          var text = span.textContent;
          if (span.classList.contains('speaker')) {
            speaker = text.replace(/^\s*\[?/, '').replace(/\]?\s*$/, '').trim();
            return;
          }
          words.push(text);
        });
        var line = words.join('').replace(/\s+/g, ' ').trim();
        if (line !== '') out.push({ speaker: speaker, text: line });
      });
      return out;
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function confirmCopied() {
      btn.dataset.copied = '1';
      btn.innerHTML = CHECK_ICON;
      btn.setAttribute('aria-label', 'Transcript copied');
      btn.setAttribute('title', 'Copied');
      status.textContent = '';
      status.textContent = 'Transcript copied to clipboard.';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        delete btn.dataset.copied;
        btn.innerHTML = COPY_ICON;
        btn.setAttribute('aria-label', 'Copy transcript');
        btn.setAttribute('title', 'Copy transcript');
      }, 1500);
    }

    btn.addEventListener('click', function () {
      var parts = blocks();
      if (parts.length === 0) return;
      var plain = parts.map(function (b) {
        return (b.speaker ? b.speaker + ': ' : '') + b.text;
      }).join('\n\n') + '\n';
      var html = parts.map(function (b) {
        return '<p>' + (b.speaker ? '<b>' + escapeHtml(b.speaker) + ':</b> ' : '')
          + escapeHtml(b.text) + '</p>';
      }).join('\n');

      if (navigator.clipboard && window.ClipboardItem && navigator.clipboard.write) {
        navigator.clipboard.write([new ClipboardItem({
          'text/plain': new Blob([plain], { type: 'text/plain' }),
          'text/html': new Blob([html], { type: 'text/html' }),
        })]).then(confirmCopied, function () { fallback(plain); });
      } else {
        fallback(plain);
      }
    });

    // Older engines, and any page served without a secure context: plain text
    // through the legacy path rather than no copy button at all.
    function fallback(plain) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(plain).then(confirmCopied, legacy);
        return;
      }
      legacy();
      function legacy() {
        var area = document.createElement('textarea');
        area.value = plain;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed; top:-1000px; left:-1000px;';
        document.body.appendChild(area);
        area.select();
        try { document.execCommand('copy'); confirmCopied(); } catch (e) { /* nothing more to try */ }
        area.remove();
      }
    }
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/gh/hyperaudio/hyperaudio-lite/js/hyperaudio-lite.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hyperaudio/hyperaudio-lite/js/hyperaudio-lite-extension.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hyperaudio/hyperaudio-lite/js/share-this.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hyperaudio/hyperaudio-lite/js/share-this-clipboard.js"></script>
  <script>
  // minimizedMode is still experimental - it aims to show the current words in the title, which can be seen on the browser tab.
  let minimizedMode = false;
  let autoScroll = true;
  let doubleClick = false;
  let webMonetization = true;
  let playOnClick = true;

  new HyperaudioLite("hypertranscript", "hyperplayer", minimizedMode, autoScroll, doubleClick, webMonetization, playOnClick);

  // The library writes "<selection> <url>" as one blob into #clipboard-text
  // and opens the dialog. Split that into the two things it actually is —
  // the quotation and the link back to the moment — and read the in/out
  // points out of the link's media fragment. Registered after the library's
  // own listener, so the text is already in place when this runs; anything
  // it doesn't recognise is left exactly as the library wrote it.
  (function () {
    const btn = document.getElementById('popover-btn');
    const textEl = document.getElementById('clipboard-text');
    const linkEl = document.getElementById('clipboard-link');
    const rangeEl = document.getElementById('clipboard-range');
    if (btn === null || textEl === null) return;

    const clock = (seconds) => {
      const t = Math.max(0, Math.round(seconds));
      const pad = (n) => String(n).padStart(2, '0');
      const h = Math.floor(t / 3600);
      return (h > 0 ? h + ':' + pad(Math.floor((t % 3600) / 60)) : Math.floor((t % 3600) / 60))
        + ':' + pad(t % 60);
    };

    btn.addEventListener('click', () => {
      linkEl.hidden = true;
      rangeEl.hidden = true;
      const raw = textEl.textContent;
      const link = raw.match(/\s(https?:\/\/\S+)$/);
      if (link === null) return;
      textEl.textContent = raw.slice(0, link.index).trim();
      linkEl.textContent = link[1];
      linkEl.hidden = false;
      const fragment = link[1].match(/=([\d.]+),([\d.]+)/);
      if (fragment !== null) {
        rangeEl.textContent = clock(parseFloat(fragment[1])) + ' → ' + clock(parseFloat(fragment[2]));
        rangeEl.hidden = false;
      }
    });
  })();

  </script>
</body>
</html>
